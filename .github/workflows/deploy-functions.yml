name: Deploy Azure Functions App

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "shared/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: func-parser-southcentral
  AZURE_FUNCTIONAPP_PACKAGE_PATH: functions
  AZURE_RESOURCE_GROUP: Archivum
  AZURE_STORAGE_ACCOUNT_NAME: archivum9b78

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build shared package as wheel
        run: |
          pip install build
          python -m build shared --wheel --outdir functions/

      - name: Add shared wheel to requirements.txt
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          WHEEL_FILE=$(ls *.whl)
          echo "$WHEEL_FILE" >> requirements.txt

      - name: Install dependencies and build package
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Verify installed packages
        run: |
          pip list --path="functions/.python_packages/lib/site-packages" | grep -i azure

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          remote-build: false

      - name: Create Event Grid subscription for blob trigger
        run: |
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          STORAGE_ACCOUNT_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.Storage/storageAccounts/${AZURE_STORAGE_ACCOUNT_NAME}"
          FUNCTION_RESOURCE_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.Web/sites/${AZURE_FUNCTIONAPP_NAME}/functions/process_auction_pdf"
          az eventgrid event-subscription create \
            --name "blob-created-parser" \
            --source-resource-id "$STORAGE_ACCOUNT_ID" \
            --endpoint "$FUNCTION_RESOURCE_ID" \
            --endpoint-type azurefunction \
            --included-event-types Microsoft.Storage.BlobCreated \
            --subject-begins-with "/blobServices/default/containers/input-pdfs/blobs/" \
            --subject-ends-with ".pdf" \
            -o none || echo "Event Grid subscription may already exist"
