name: Deploy Azure Functions App

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "shared/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: func-parser-southcentral
  AZURE_FUNCTIONAPP_PACKAGE_PATH: functions
  AZURE_RESOURCE_GROUP: Archivum
  AZURE_STORAGE_ACCOUNT_NAME: archivum9b78

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Copy shared source into functions
        run: |
          cp -r shared/archivum functions/archivum
          find functions/archivum -type d -name __pycache__ -exec rm -rf {} + || true

      - name: Install dependencies
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Verify installed packages
        run: |
          pip list --path="functions/.python_packages/lib/site-packages" | grep -i azure

      - name: Smoke test imports
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          PYTHONPATH=".:./.python_packages/lib/site-packages" python -c "import archivum; print('archivum imports OK')"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          remote-build: false

      - name: Verify function app status
        run: |
          echo "=== Checking function app status ==="
          az functionapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_FUNCTIONAPP_NAME" --query "{state: state, kind: kind, runtime: siteConfig.linuxFxVersion}" -o table
          
          echo ""
          echo "=== Listing app settings ==="
          az functionapp config appsettings list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_FUNCTIONAPP_NAME" --query "[?name=='AzureWebJobsStorage' || name=='FUNCTIONS_WORKER_RUNTIME' || name=='blob_storage_connection' || name=='az_appconfig_endpoint'].{name: name, value: value}" -o table
          
          echo ""
          echo "=== Listing functions ==="
          az functionapp function list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_FUNCTIONAPP_NAME" -o table || echo "No functions found or command failed"
          
          echo ""
          echo "=== Checking recent logs ==="
          az monitor activity-log list --resource-id "/subscriptions/$(az account show --query id -o tsv)/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Web/sites/$AZURE_FUNCTIONAPP_NAME" --max-events 5 -o table || echo "No recent activity logs"

      - name: Fetch host runtime logs
        if: always()
        run: |
          echo "=== Enabling filesystem logging (no-op if already enabled) ==="
          az webapp log config -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_FUNCTIONAPP_NAME" --docker-container-logging filesystem -o none || true

          echo "=== Waiting for host to restart and index functions ==="
          sleep 60

          echo "=== Fetching Kudu docker/container logs (includes Python worker tracebacks) ==="
          CREDS=$(az webapp deployment list-publishing-credentials -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_FUNCTIONAPP_NAME" --query "{user: publishingUserName, pass: publishingPassword}" -o json)
          KUDU_USER=$(echo "$CREDS" | jq -r .user)
          KUDU_PASS=$(echo "$CREDS" | jq -r .pass)
          LOG_URLS=$(curl -s -u "$KUDU_USER:$KUDU_PASS" "https://${AZURE_FUNCTIONAPP_NAME}.scm.azurewebsites.net/api/logs/docker" | jq -r '.[].href' || true)
          for URL in $LOG_URLS; do
            echo "--- $URL ---"
            curl -s -u "$KUDU_USER:$KUDU_PASS" "$URL" | tail -n 150 || true
          done

          echo ""
          echo "=== Host status probe ==="
          az rest --method post \
            --url "https://management.azure.com/subscriptions/$(az account show --query id -o tsv)/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.Web/sites/${AZURE_FUNCTIONAPP_NAME}/host/default/listKeys?api-version=2023-12-01" \
            -o none && echo "Host responded OK" || echo "Host is NOT healthy - check container logs above for the traceback"
