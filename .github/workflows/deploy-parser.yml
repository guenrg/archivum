name: Deploy Parser Function App

on:
  push:
    branches:
      - main
    paths:
      - "Parser/**"
      - ".github/workflows/deploy-parser.yml"
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: func-parser-southcentral
  AZURE_FUNCTIONAPP_PACKAGE_PATH: Parser
  AZURE_RESOURCE_GROUP: Archivum

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Enable remote build on the function app
        run: |
          az functionapp config appsettings set \
            -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_FUNCTIONAPP_NAME" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true ENABLE_ORYX_BUILD=true \
            -o none
          az functionapp config appsettings delete \
            -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_FUNCTIONAPP_NAME" \
            --setting-names WEBSITE_RUN_FROM_PACKAGE \
            -o none || true

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          remote-build: true
